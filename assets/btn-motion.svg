<svg xmlns="http://www.w3.org/2000/svg" width="240" height="76" viewBox="0 0 240 76" role="img" aria-label="Motion catalog">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FBCFF"/><stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#22A9F4" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0059B3" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="14" y="10" width="212" height="42" rx="21" fill="url(#fill)"/>
    <rect x="14" y="10" width="212" height="42" rx="21" fill="url(#gloss)"/>
    <rect x="14.7" y="10.7" width="210.6" height="40.6" rx="20.3" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
  </g>
  <text x="120" y="36.5" text-anchor="middle" font-family="'Segoe UI',Verdana,Geneva,'DejaVu Sans',sans-serif" font-size="14" font-weight="600" letter-spacing="0.4" fill="#FFFFFF">Motion catalog<tspan font-size="18" font-weight="400" dx="6">→</tspan></text>
</svg>
