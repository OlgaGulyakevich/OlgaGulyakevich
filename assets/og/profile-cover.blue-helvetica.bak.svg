<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Olga Gulyakevich — Frontend Developer">
  <!-- Палитра Motion Passport. Глубина: атмосферное свечение + шар бренда за правым краем
       + виньетка + зерно. Композиция своя — сетка и лого в углу это вёрстка курса. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A292D"/>
      <stop offset="1" stop-color="#3A3943"/>
    </linearGradient>

    <!-- шар: паспортный циан → паспортный синий, диагональю как в фавиконке -->
    <linearGradient id="orb" x1=".06" y1=".04" x2=".94" y2=".96">
      <stop offset="0"   stop-color="#C6F9FF"/>
      <stop offset=".46" stop-color="#7FD4F7"/>
      <stop offset="1"   stop-color="#25AAF3"/>
    </linearGradient>

    <!-- атмосферное свечение. Восемь остановок по гауссовой кривой:
         линейный спад в ноль даёт излом производной, и глаз видит край (полосы Маха). -->
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5FC0EE" stop-opacity="0.300"/>
      <stop offset="0.14" stop-color="#5FC0EE" stop-opacity="0.270"/>
      <stop offset="0.28" stop-color="#5FC0EE" stop-opacity="0.216"/>
      <stop offset="0.42" stop-color="#5FC0EE" stop-opacity="0.153"/>
      <stop offset="0.55" stop-color="#5FC0EE" stop-opacity="0.099"/>
      <stop offset="0.68" stop-color="#5FC0EE" stop-opacity="0.057"/>
      <stop offset="0.8" stop-color="#5FC0EE" stop-opacity="0.027"/>
      <stop offset="0.9" stop-color="#5FC0EE" stop-opacity="0.011"/>
      <stop offset="1" stop-color="#5FC0EE" stop-opacity="0.000"/>
    </radialGradient>

    <!-- стекло: блик по верхней кромке шара, затухает книзу -->
    <linearGradient id="sheen" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".40"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx=".42" cy=".44" r=".82">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="0.58" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.09"/>
      <stop offset="0.84" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="0.93" stop-color="#000000" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- шар уходит за правый край: часть предмета вне кадра = глубина -->
  <circle cx="1078" cy="340" r="560" fill="url(#halo)"/>
  <g>
    <circle cx="1078" cy="340" r="216" fill="url(#orb)"/>
    <circle cx="1078" cy="340" r="216" fill="url(#sheen)"/>
    <circle cx="1078" cy="340" r="215.4" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.2"/>
  </g>

  <rect width="1200" height="630" fill="url(#vig)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".075"/>

  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
    <text x="94" y="250" font-size="78" font-weight="600" letter-spacing="-1.6" fill="#EDEFF4">Olga Gulyakevich</text>
    <!-- акцентная метка: цельная и короткая. Имя стоит на x=94, а не 96 —
         оптическая компенсация: круглая O при равной координате кажется утопленной -->
    <rect x="96" y="290" width="124" height="4" rx="2" fill="#FF633C"/>
    <text x="96" y="358" font-size="36" font-weight="500" letter-spacing="-0.2" fill="#B9BECC">Frontend Developer</text>
    <text x="96" y="410" font-size="27" font-weight="400" letter-spacing="0.1" fill="#949AAA">React · Next.js · TypeScript · Astro</text>
    <text x="96" y="452" font-size="27" font-weight="400" letter-spacing="0.1" fill="#949AAA">Motion · Accessibility · Design systems</text>
    <text x="96" y="520" font-size="24" font-weight="400" letter-spacing="0.2" fill="#7A7F8E">Gland, Vaud, Switzerland</text>
  </g>
</svg>
