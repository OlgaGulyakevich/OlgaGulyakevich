<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Olga Gulyakevich — Frontend Developer. React, Next.js, TypeScript, Motion and Accessibility.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#0D1B2B"/>
    </linearGradient>
    <!-- soft brand bloom: fills the right side without putting an object there -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#22A9F4" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#22A9F4" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#22A9F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB6FF"/>
      <stop offset="1" stop-color="#22A9F4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="315" r="300" fill="url(#glow)"/>

  <text x="90" y="298" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#F2F7FB">Olga Gulyakevich</text>
  <text x="90" y="372" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#3FB6FF">Frontend Developer</text>

  <!-- accent stroke under "Motion": the word also carries brightness + weight,
       so the accent survives without colour (WCAG 1.4.1) -->
  <text x="92" y="432" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="28" fill="#8FA6BC">React · Next.js · TypeScript · <tspan fill="#DCE9F5" font-weight="600">Motion</tspan> &amp; Accessibility</text>
  <path d="M 612 447 q 12 -8 25 0 t 25 0 t 25 0 t 25 0" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round"/>

  <text x="92" y="560" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" fill="#7A8FA3">Gland, Vaud, Switzerland · English · French · Russian</text>
</svg>
